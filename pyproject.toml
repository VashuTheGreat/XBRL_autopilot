[project]
name = "xbrl-autopilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "VashuTheGreat", email = "vanshsharma7832@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "openpyxl>=3.1.5",
    "lxml>=5.3.0",
    "huggingface>=0.0.1",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.6",
    "langchain-huggingface>=1.2.3",
    "logfire[system-metrics]>=5.4.0",
    "sentence-transformers>=6.2.0",
    "python-calamine>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
xbrl-autopilot = "xbrl_autopilot:main"
start = "main:start"
dev = "main:dev"



[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
