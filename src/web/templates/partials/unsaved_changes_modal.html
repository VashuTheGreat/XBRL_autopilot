<!-- Unsaved Changes Prompt Dialog (Save / Discard / Cancel) -->
<div class="modal desktop-modal-wrapper" id="modal-unsaved-changes" hidden style="display:none; z-index: 9999;">
  <div class="modal-backdrop" onclick="window.app.cancelUnsavedAction()"></div>
  <div class="modal-dialog-box" role="dialog" aria-modal="true" aria-labelledby="unsaved-heading" style="max-width: 450px;">
    
    <header class="modal-dialog-header" style="background: #fff1f2; border-bottom: 1px solid #fecdd3;">
      <div class="dialog-title-wrap">
        <span class="dialog-icon" style="color: #e11d48;">⚠️</span>
        <h3 id="unsaved-heading" style="color: #9f1239; font-size: 16px; margin: 0;">Unsaved Changes</h3>
      </div>
      <button type="button" class="dialog-close-btn" onclick="window.app.cancelUnsavedAction()" aria-label="Cancel">×</button>
    </header>

    <div class="modal-dialog-body" style="padding: 20px;">
      <p style="font-size: 14px; color: #1e293b; margin: 0 0 10px 0; font-weight: 500;">
        Do you want to save changes to <span id="unsaved-project-name" style="font-weight: 700; color: #0f172a;">Untitled Filing</span> before continuing?
      </p>
      <p style="font-size: 12px; color: #64748b; margin: 0; line-height: 1.5;">
        • <strong>Save:</strong> Persists all mapped rows, settings, and facts to disk.<br>
        • <strong>Discard:</strong> Discards your unsaved edits and removes temporary recovery files.<br>
        • <strong>Cancel:</strong> Keeps the document open so you can continue editing.
      </p>
    </div>

    <footer class="modal-dialog-footer" style="padding: 12px 20px; background: #f8fafc; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid #e2e8f0;">
      <button type="button" class="btn" onclick="window.app.cancelUnsavedAction()">Cancel</button>
      <button type="button" class="btn" style="color: #dc2626; border-color: #fca5a5;" onclick="window.app.discardUnsavedAndProceed()">Discard Changes</button>
      <button type="button" class="btn primary" onclick="window.app.saveUnsavedAndProceed()">Save &amp; Proceed</button>
    </footer>

  </div>
</div>
