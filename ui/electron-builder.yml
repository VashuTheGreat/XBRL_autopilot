# Installer config (docs/10-packaging-release.md). Phase 11b: Windows & Linux packaging.
appId: in.xbrlautopilot.desktop
productName: XBRL Autopilot
copyright: Copyright © 2026 XBRL Autopilot
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: ../engine/authority
    to: authority
    filter: ['*.json']
  - from: ../knowledge_base
    to: knowledge_base
    filter: ['*.json']
  - from: ../sidecar-dist/xap-sidecar
    to: sidecar
asar: true
# Double-clicking a .axbrl project opens it in the app (ui/electron/main/index.ts → findProjectArg).
fileAssociations:
  - ext: axbrl
    name: XBRL Autopilot Project
    description: XBRL Autopilot filing project
    role: Editor
linux:
  target:
    - AppImage
    - deb
  category: Office
  synopsis: Offline MCA XBRL Filing Desktop Application
  artifactName: "${productName}-${version}.${ext}"
deb:
  maintainer: "VashuTheGreat <vanshsharma7832@gmail.com>"
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: XBRL Autopilot
  artifactName: "${productName}-Setup-${version}.${ext}"
